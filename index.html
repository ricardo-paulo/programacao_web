<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moeda</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8" crossorigin="anonymous"></script>
</head>
<body>
    <main class="container-xxl row m-auto mt-5">
        <div class="col-1 col-md-3"></div>
        <div class="main-column col-10 col-md-6 align-content-center p-4 rounded-3">

            <h1>Conversor de Moeda</h1>

            <div class="input-group mb-2">
                <span class="input-group-text" id="basic-addon1">R$</span>
                <input type="number" class="form-control" id="realInput" placeholder="0.00">
            </div>

            <select class="form-select mb-2" aria-label="Selecione a moeda" id="coinSelector">
                <option value="no-selection" selected>Selecione a moeda</option>
                <option value="dolar">Dolar Americano ($)</option>
                <option value="euro">Euro (€)</option>
                <option value="libra">Libras Esterlinas (£)</option>
                <option value="iene">Iene (¥)</option>
            </select>

            <div class="input-group">
                <span class="input-group-text" id="resultCoin">?</span>
                <input type="number" id="resultBox" class="form-control" disabled readonly>
            </div>

        </div>
        <div class="col-1 col-md-3"></div>
    </main>
</body>
</html>
